<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>月历</title>
<meta name="description" content="按年、月、周查看与管理带优先级颜色的事件">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="月历">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" id="themeLight">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" id="themeDark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mcal.settings.v1') || '{}');
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.vault) document.documentElement.classList.add('locked');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<link rel="stylesheet" href="styles.css?v=0.13.0">
</head>
<body>

<div id="pages">
  <!-- 今日 -->
  <section class="page" id="page-today">
    <header class="ptitle">
      <div><h1>今天</h1><p id="todayDate"></p></div>
    </header>
    <div class="pscroll" id="todayBody"></div>
  </section>

  <!-- 日历 -->
  <section class="page active" id="page-cal">
    <header class="topbar">
      <button class="gbtn glass" id="btnView" aria-label="切换年 / 月 / 周视图" aria-haspopup="menu">
        <span id="viewLabel">月</span>
      </button>
      <div class="title-wrap">
        <button class="nav-btn" id="btnPrev" aria-label="上一个">‹</button>
        <div class="title"><h1 id="calTitle"></h1><p id="calSub"></p></div>
        <button class="nav-btn" id="btnNext" aria-label="下一个">›</button>
      </div>
      <button class="gbtn glass" id="btnToday" aria-label="回到今天"><span class="today-ico" id="todayNum"></span></button>
    </header>
    <div class="weekdays" id="weekdays"></div>
    <div class="cal-body" id="calBody">
      <div id="calViewport"><div id="calZoom"><div id="calTrack"></div></div></div>
      <div class="preview glass-panel" id="preview" aria-live="polite"></div>
    </div>
  </section>

  <!-- 四象限 -->
  <section class="page" id="page-quad">
    <header class="ptitle">
      <div><button class="pswitch" aria-haspopup="menu" aria-label="切换四象限 / 课表"><h1>四象限</h1><svg class="psw-chev" viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5"/></svg></button><p>按优先级查看所有事件</p></div>
      <button class="chip-btn glass" id="btnQuadDone">显示已完成</button>
    </header>
    <div class="quad" id="quadBody"></div>
  </section>

  <!-- 课表 -->
  <section class="page" id="page-sched">
    <header class="ptitle">
      <div><button class="pswitch" aria-haspopup="menu" aria-label="切换四象限 / 课表"><h1>课表</h1><svg class="psw-chev" viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5"/></svg></button></div>
      <div class="sc-actions"><button class="chip-btn glass" id="schedImport">导入</button></div>
    </header>
    <div class="sc-nav" id="schedNav">
      <button class="nav-btn" id="schedPrev" aria-label="上一周">‹</button>
      <button class="sc-week" id="schedWeekBtn" aria-label="选择月份和周"><b id="schedWeekMain"></b><small id="schedWeekSub"></small></button>
      <button class="nav-btn" id="schedNext" aria-label="下一周">›</button>
      <button class="chip-btn glass sc-fit" id="schedFit" hidden>还原</button>
      <button class="chip-btn glass sc-this" id="schedThisWeek" hidden>本周</button>
    </div>
    <div class="pscroll sc-scroll" id="schedBody"></div>
  </section>

  <!-- 设置 -->
  <section class="page" id="page-set">
    <div class="pscroll" id="setBody">
      <div class="profile">
        <button class="avatar" id="avatarBtn" aria-label="更换头像">
          <img id="avatarImg" alt="" hidden>
          <span id="avatarInitial"></span>
          <span class="avatar-edit">更换</span>
        </button>
        <div class="profile-main">
          <input id="nickInput" class="nick" placeholder="设置昵称" maxlength="20" autocomplete="off">
          <span class="status-pill" id="statusPill"><i></i><span id="profileSub"></span></span>
        </div>
      </div>
      <div id="setGroups"></div>
      <div class="foot"><img src="icons/icon-192.png" alt=""><b>月历</b><span id="statLine"></span></div>
    </div>
  </section>
</div>

<!-- 底部菜单栏（可点击，也可长按拖动切换） -->
<div class="dock" id="dock">
  <nav class="tabbar glass" id="tabbar">
    <span class="tab-ind" id="tabInd"></span>
    <button data-page="today" aria-label="今日">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.4 12.2l2.5 2.5 4.7-5.2"/></svg>
      <span>今日</span>
    </button>
    <button data-page="cal" class="on" aria-label="日历">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.2h17M8 2.8v3.4M16 2.8v3.4"/><text id="tabCalNum" x="12" y="17.9" text-anchor="middle" font-size="8.6" font-weight="700" fill="currentColor" stroke="none" style="font-variant-numeric:tabular-nums;letter-spacing:-.2px">1</text></svg>
      <span>日历</span>
    </button>
    <button data-page="quad" aria-label="四象限">
      <svg viewBox="0 0 24 24" class="filled"><rect x="4" y="4" width="7" height="7" rx="2.2"/><rect x="13" y="4" width="7" height="7" rx="2.2"/><rect x="4" y="13" width="7" height="7" rx="2.2"/><rect x="13" y="13" width="7" height="7" rx="2.2"/></svg>
      <span>四象限</span>
    </button>
    <button data-page="set" aria-label="设置">
      <span class="tab-avatar" id="tabAvatar" hidden></span>
      <svg viewBox="0 0 24 24" id="tabGear"><path d="M10.40 5.08L10.75 2.48 L13.25 2.48 L13.60 5.08A7.1 7.1 0 0 1 15.76 5.98L17.84 4.38 L19.62 6.16 L18.02 8.24A7.1 7.1 0 0 1 18.92 10.40L21.52 10.75 L21.52 13.25 L18.92 13.60A7.1 7.1 0 0 1 18.02 15.76L19.62 17.84 L17.84 19.62 L15.76 18.02A7.1 7.1 0 0 1 13.60 18.92L13.25 21.52 L10.75 21.52 L10.40 18.92A7.1 7.1 0 0 1 8.24 18.02L6.16 19.62 L4.38 17.84 L5.98 15.76A7.1 7.1 0 0 1 5.08 13.60L2.48 13.25 L2.48 10.75 L5.08 10.40A7.1 7.1 0 0 1 5.98 8.24L4.38 6.16 L6.16 4.38 L8.24 5.98A7.1 7.1 0 0 1 10.40 5.08Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<!-- 加号：固定在右下角菜单栏上方 -->
<button class="fab glass accent" id="fab" aria-label="添加事件">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

<!-- 左侧日历栏：在日历页从左往右滑动拉出 -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="calDrawer" aria-label="选择日历" aria-hidden="true">
  <header class="dr-head"><h2>日历</h2><p>每个日历的内容分开显示</p></header>
  <div class="dr-list" id="drawerList"></div>
  <button class="dr-add" id="drawerAdd">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-width="2.2"/></svg>
    新建记录日历
  </button>
</aside>

<div class="backdrop" id="backdrop"></div>

<!-- 添加 / 编辑 -->
<section class="sheet composer" id="composer" aria-label="添加事件">
  <div class="handle"></div>
  <div class="cmp-head">
    <h2 id="cmpHeading">新建事件</h2>
    <span class="spacer"></span>
    <div class="cmp-edit" id="cmpEditBar">
      <button class="cmp-check" id="cmpDone" aria-pressed="false"><i></i><span>已完成</span></button>
      <button class="text-btn danger" id="cmpDelete">删除</button>
    </div>
    <button class="text-btn muted" id="cmpClear" hidden>清空</button>
    <button class="cmp-batch" id="cmpBatch">批量</button>
    <button class="cmp-save" id="cmpSave">添加</button>
  </div>
  <div class="cmp-card">
    <textarea id="cmpTitle" rows="1" placeholder="准备做什么？" enterkeyhint="done"></textarea>
    <textarea id="cmpNote" rows="2" placeholder="备注（选填）"></textarea>
  </div>
  <div class="cmp-sec">
    <span class="cmp-label">优先级</span>
    <div class="cmp-chips" id="cmpPri"></div>
  </div>
  <div class="cmp-sec">
    <span class="cmp-label">日期</span>
    <div class="cmp-chips" id="cmpQuick"></div>
    <div class="cmp-other" id="cmpOther" hidden>
      <div class="cmp-other-head"><span id="cmpOtherTitle">选择日期</span>
        <div class="seg small" id="cmpOtherMode"><button data-v="cal" class="on">日历</button><button data-v="wheel">滚轮</button></div>
      </div>
      <div id="cmpOtherBody"></div>
    </div>
  </div>
  <div class="cmp-tools">
    <button class="tool date-tool glass" id="cmpDate">
      <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span id="cmpDateLabel"></span>
    </button>
    <span class="spacer"></span>
  </div>
</section>

<!-- 批量添加 -->
<section class="sheet tall" id="batchSheet" aria-label="批量添加">
  <div class="handle"></div>
  <div class="sheet-head">
    <button class="text-btn muted" data-close>取消</button>
    <h2>批量添加</h2>
    <button class="text-btn strong" id="batchSave">添加</button>
  </div>
  <p class="sheet-hint">名称必填；不选优先级默认为灰色；备注可不填。</p>
  <div class="batch-list" id="batchList"></div>
  <div class="batch-foot"><button class="chip-btn glass" id="batchAddRow">＋ 再加一行</button></div>
</section>

<!-- 日期 / 时间段 -->
<section class="sheet picker" id="datePicker" aria-label="选择日期">
  <div class="pk-head">
    <button class="round glass" id="pkCancel" aria-label="取消">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="seg small" id="pkTabs"><button data-v="date" class="on">日期</button><button data-v="range">时间段</button></div>
    <button class="round glass accent" id="pkOk" aria-label="确定">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="pk-body" id="pkBody"></div>
</section>

<!-- 通用表单（连接 GitHub、修改密码等） -->
<section class="sheet" id="formSheet" aria-label="表单">
  <div class="handle"></div>
  <div class="sheet-head">
    <button class="text-btn muted" data-close>取消</button>
    <h2 id="formTitle"></h2>
    <button class="text-btn strong" id="formSubmit">确定</button>
  </div>
  <form class="form" id="formBody" autocomplete="off"></form>
</section>

<!-- 课表：导入 / 编辑 -->
<section class="sheet tall" id="schedSheet" aria-label="课表">
  <div class="handle"></div>
  <div class="sheet-head">
    <button class="text-btn muted" data-close>取消</button>
    <h2 id="schedTitle">导入课表</h2>
    <button class="text-btn strong" id="schedOk">导入</button>
  </div>
  <div class="form" id="schedForm"></div>
</section>
<!-- 选择月份和周 -->
<div class="cpop-scrim" id="wkpickScrim"></div>
<div class="wkpick" id="wkpick" role="dialog" aria-label="选择周"></div>
<!-- 课程信息浮窗 -->
<div class="cpop-scrim" id="cpopScrim"></div>
<div class="cpop" id="cpop" role="dialog" aria-label="课程信息"></div>
<input type="file" id="schedFile" accept=".ics,text/calendar" hidden>

<!-- 帮助 -->
<section class="sheet tall" id="helpSheet" aria-label="帮助">
  <div class="handle"></div>
  <div class="sheet-head">
    <span></span>
    <h2 id="helpTitle"></h2>
    <button class="text-btn" data-close>完成</button>
  </div>
  <div class="help-body" id="helpBody"></div>
</section>

<div class="popover glass-panel" id="popover" role="menu"></div>

<!-- 锁屏 -->
<div class="lock" id="lock" aria-label="输入密码解锁">
  <div class="lock-card">
    <div class="avatar big" id="lockAvatar"></div>
    <h2 id="lockName"></h2>
    <p>月历不再使用开屏密码。最后输入一次原来的密码，之后打开就不用了。</p>
    <form id="lockForm" autocomplete="off">
      <input id="lockPw" type="password" placeholder="密码" enterkeyhint="go" autocomplete="current-password">
      <button class="wide-btn glass accent" type="submit">完成</button>
    </form>
    <p class="lock-err" id="lockErr"></p>
    <button class="text-btn muted small" id="lockForgot">忘记密码（重新粘贴令牌即可）</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="avatarFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/store.js?v=0.13.0"></script>
<script src="js/native.js?v=0.13.0"></script>
<script src="js/ui.js?v=0.13.0"></script>
<script src="js/calendar.js?v=0.13.0"></script>
<script src="js/editor.js?v=0.13.0"></script>
<script src="js/push.js?v=0.13.0"></script>
<script src="js/sched.js?v=0.13.0"></script>
<script src="js/drawer.js?v=0.13.0"></script>
<script src="js/app.js?v=0.13.0"></script>
</body>
</html>
