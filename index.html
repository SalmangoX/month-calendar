<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>月历</title>
<meta name="description" content="按年、月、周查看与管理带优先级颜色的事件">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="月历">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mcal.settings.v1') || '{}');
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.vault) document.documentElement.classList.add('locked');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="pages">
  <!-- 今日 -->
  <section class="page" id="page-today">
    <header class="ptitle">
      <div><h1>今天</h1><p id="todayDate"></p></div>
    </header>
    <div class="pscroll" id="todayBody"></div>
  </section>

  <!-- 日历 -->
  <section class="page active" id="page-cal">
    <header class="topbar">
      <button class="gbtn glass" id="btnView" aria-label="切换年 / 月 / 周视图" aria-haspopup="menu">
        <span id="viewLabel">月</span>
      </button>
      <div class="title-wrap">
        <button class="nav-btn" id="btnPrev" aria-label="上一个">‹</button>
        <div class="title"><h1 id="calTitle"></h1><p id="calSub"></p></div>
        <button class="nav-btn" id="btnNext" aria-label="下一个">›</button>
      </div>
      <button class="gbtn glass" id="btnToday" aria-label="回到今天"><span class="today-ico" id="todayNum"></span></button>
    </header>
    <div class="weekdays" id="weekdays"></div>
    <div class="cal-body" id="calBody">
      <div id="calViewport"><div id="calTrack"></div></div>
      <div class="preview glass-panel" id="preview" aria-live="polite"></div>
    </div>
  </section>

  <!-- 四象限 -->
  <section class="page" id="page-quad">
    <header class="ptitle">
      <div><h1>四象限</h1><p>按优先级查看所有事件</p></div>
      <button class="chip-btn glass" id="btnQuadDone">显示已完成</button>
    </header>
    <div class="quad" id="quadBody"></div>
  </section>

  <!-- 设置 -->
  <section class="page" id="page-set">
    <div class="pscroll" id="setBody">
      <div class="profile glass-panel">
        <button class="avatar" id="avatarBtn" aria-label="更换头像">
          <img id="avatarImg" alt="" hidden>
          <span id="avatarInitial"></span>
          <span class="avatar-edit">更换</span>
        </button>
        <div class="profile-main">
          <input id="nickInput" class="nick" placeholder="点这里设置昵称" maxlength="20" autocomplete="off">
          <p id="profileSub"></p>
        </div>
      </div>

      <h3>外观</h3>
      <div class="seg" id="sTheme">
        <button data-v="auto">跟随系统</button><button data-v="light">浅色</button><button data-v="dark">深色</button>
      </div>

      <h3>日历</h3>
      <div class="group">
        <div class="grow"><span>每周第一天</span>
          <div class="seg small" id="sWeek"><button data-v="0">周日</button><button data-v="1">周一</button></div>
        </div>
      </div>

      <h3>账户与同步</h3>
      <div class="group" id="syncGroup"></div>
      <p class="hint" id="syncHint"></p>

      <h3>提醒通知</h3>
      <div class="group" id="notifyGroup"></div>
      <p class="hint" id="notifyHint"></p>

      <h3>桌面小组件</h3>
      <div class="group">
        <div class="grow">
          <button class="grow-main" id="btnCopyIOS">复制 iOS 小组件脚本</button>
          <button class="help glass" data-help="ios" aria-label="iOS 小组件设置步骤">?</button>
        </div>
        <div class="grow">
          <button class="grow-main" id="btnCopyAndroid">复制安卓小组件链接</button>
          <button class="help glass" data-help="android" aria-label="安卓小组件设置步骤">?</button>
        </div>
      </div>

      <h3>数据</h3>
      <div class="group">
        <div class="grow"><button class="grow-main" id="btnExport">导出备份</button></div>
        <div class="grow"><button class="grow-main" id="btnImport">导入备份</button><span class="grow-note">与现有数据合并</span></div>
      </div>
      <p class="foot" id="statLine"></p>
    </div>
  </section>
</div>

<!-- 底部：加号 + 菜单栏 -->
<div class="dock" id="dock">
  <button class="fab glass accent" id="fab" aria-label="添加事件">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <nav class="tabbar glass" id="tabbar">
    <button data-page="today" aria-label="今日">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.4 12.2l2.5 2.5 4.7-5.2"/></svg>
      <span>今日</span>
    </button>
    <button data-page="cal" class="on" aria-label="日历">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M8 3v4M16 3v4"/><text id="tabCalNum" x="12" y="17.4" text-anchor="middle" font-size="7.6" font-weight="700" fill="currentColor" stroke="none">1</text></svg>
      <span>日历</span>
    </button>
    <button data-page="quad" aria-label="四象限">
      <svg viewBox="0 0 24 24" class="filled"><rect x="4" y="4" width="7" height="7" rx="2.2"/><rect x="13" y="4" width="7" height="7" rx="2.2"/><rect x="4" y="13" width="7" height="7" rx="2.2"/><rect x="13" y="13" width="7" height="7" rx="2.2"/></svg>
      <span>四象限</span>
    </button>
    <button data-page="set" aria-label="设置">
      <span class="tab-avatar" id="tabAvatar" hidden></span>
      <svg viewBox="0 0 24 24" id="tabGear"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7.6 7.6 0 0 1-1.7 1l-.3 2h-3.6l-.3-2a7.6 7.6 0 0 1-1.7-1l-1.9.7L5 14.7l1.6-1.2a7.4 7.4 0 0 1 0-2L5 10.3l1.8-3.1 1.9.7a7.6 7.6 0 0 1 1.7-1l.3-2h3.6l.3 2a7.6 7.6 0 0 1 1.7 1l1.9-.7 1.8 3.1-1.6 1.2a7.4 7.4 0 0 1 0 2z"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>

<!-- 添加 / 编辑 -->
<section class="sheet composer" id="composer" aria-label="添加事件">
  <div class="cmp-edit" id="cmpEditBar">
    <button class="cmp-check" id="cmpDone" aria-pressed="false"><i></i><span>已完成</span></button>
    <span class="spacer"></span>
    <button class="text-btn danger" id="cmpDelete">删除</button>
  </div>
  <textarea id="cmpTitle" rows="1" placeholder="准备做什么？" enterkeyhint="done"></textarea>
  <input id="cmpNote" type="text" placeholder="备注（选填）" autocomplete="off">
  <div class="cmp-tools">
    <button class="tool date-tool glass" id="cmpDate">
      <svg viewBox="0 0 24 24" width="17" height="17"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span id="cmpDateLabel"></span>
    </button>
    <button class="tool icon-tool glass" id="cmpFlag" aria-label="优先级">
      <svg viewBox="0 0 24 24" width="19" height="19"><path d="M6 21V4h11l-2.2 4.2L17 12.5H6"/></svg>
    </button>
    <button class="tool glass" id="cmpBatch">批量</button>
    <span class="spacer"></span>
    <button class="send glass accent" id="cmpSend" aria-label="添加">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V6M6 11.5L12 5.5l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</section>

<!-- 批量添加 -->
<section class="sheet tall" id="batchSheet" aria-label="批量添加">
  <div class="handle"></div>
  <div class="sheet-head">
    <button class="text-btn muted" data-close>取消</button>
    <h2>批量添加</h2>
    <button class="text-btn strong" id="batchSave">添加</button>
  </div>
  <p class="sheet-hint">名称必填；不选优先级默认为灰色；备注可不填。</p>
  <div class="batch-list" id="batchList"></div>
  <div class="batch-foot"><button class="chip-btn glass" id="batchAddRow">＋ 再加一行</button></div>
</section>

<!-- 日期 / 时间段 -->
<section class="sheet picker" id="datePicker" aria-label="选择日期">
  <div class="pk-head">
    <button class="round glass" id="pkCancel" aria-label="取消">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="seg small" id="pkTabs"><button data-v="date" class="on">日期</button><button data-v="range">时间段</button></div>
    <button class="round glass accent" id="pkOk" aria-label="确定">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="pk-body" id="pkBody"></div>
</section>

<!-- 通用表单（连接 GitHub、修改密码等） -->
<section class="sheet" id="formSheet" aria-label="表单">
  <div class="handle"></div>
  <div class="sheet-head">
    <button class="text-btn muted" data-close>取消</button>
    <h2 id="formTitle"></h2>
    <button class="text-btn strong" id="formSubmit">确定</button>
  </div>
  <form class="form" id="formBody" autocomplete="off"></form>
</section>

<!-- 帮助 -->
<section class="sheet tall" id="helpSheet" aria-label="帮助">
  <div class="handle"></div>
  <div class="sheet-head">
    <span></span>
    <h2 id="helpTitle"></h2>
    <button class="text-btn" data-close>完成</button>
  </div>
  <div class="help-body" id="helpBody"></div>
</section>

<div class="popover glass-panel" id="popover" role="menu"></div>

<!-- 锁屏 -->
<div class="lock" id="lock" aria-label="输入密码解锁">
  <div class="lock-card">
    <div class="avatar big" id="lockAvatar"></div>
    <h2 id="lockName"></h2>
    <p>输入密码解锁</p>
    <form id="lockForm" autocomplete="off">
      <input id="lockPw" type="password" placeholder="密码" enterkeyhint="go" autocomplete="current-password">
      <button class="wide-btn glass accent" type="submit">解锁</button>
    </form>
    <p class="lock-err" id="lockErr"></p>
    <button class="text-btn muted small" id="lockForgot">忘记密码</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="avatarFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/calendar.js"></script>
<script src="js/editor.js"></script>
<script src="js/push.js"></script>
<script src="js/app.js"></script>
</body>
</html>
