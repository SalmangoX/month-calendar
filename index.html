<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>月历</title>
<meta name="description" content="按月查看与管理带优先级颜色的事件">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="月历">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // 尽早应用主题，避免闪白
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mcal.settings.v1') || '{}');
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn today-btn" id="btnToday" aria-label="回到今天"><span id="todayNum">1</span></button>
  <div class="title-wrap">
    <button class="nav-btn" id="btnPrev" aria-label="上个月">‹</button>
    <div class="title">
      <h1 id="monthTitle">10月</h1>
      <p id="monthSub">2026</p>
    </div>
    <button class="nav-btn" id="btnNext" aria-label="下个月">›</button>
  </div>
  <button class="icon-btn" id="btnMenu" aria-label="设置">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
  </button>
</header>

<div class="weekdays" id="weekdays"></div>

<main id="viewport" aria-label="月视图，上下滑动切换月份">
  <div id="track">
    <div class="panel"></div>
    <div class="panel"></div>
    <div class="panel"></div>
  </div>
</main>

<button class="fab" id="fab" aria-label="新建事件">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>

<div class="backdrop" id="backdrop"></div>

<!-- 某天的事件 -->
<section class="sheet" id="daySheet" aria-label="当天事件">
  <div class="handle"></div>
  <div class="sheet-head">
    <div>
      <h2 id="dayTitle"></h2>
      <p id="daySub"></p>
    </div>
    <button class="text-btn" data-close>完成</button>
  </div>
  <ul class="list" id="dayList"></ul>
  <form class="quick" id="quickAdd" autocomplete="off">
    <input id="quickInput" type="text" placeholder="添加事件" enterkeyhint="done">
    <div class="pri-dots" id="quickPri"></div>
    <button type="submit" class="add-btn" aria-label="添加">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </form>
</section>

<!-- 新建 / 编辑 -->
<section class="sheet" id="editSheet" aria-label="编辑事件">
  <div class="handle"></div>
  <div class="sheet-head">
    <button class="text-btn muted" data-close>取消</button>
    <h2 id="editTitle">新建事件</h2>
    <button class="text-btn strong" id="btnSave">保存</button>
  </div>
  <div class="form">
    <input id="fTitle" type="text" placeholder="事件名称" class="big-input" autocomplete="off">
    <label class="row"><span>日期</span><input id="fDate" type="date"></label>
    <div class="row"><span>优先级</span><div class="seg pri-seg" id="fPri"></div></div>
    <label class="row" id="rowDone"><span>已完成</span><input id="fDone" type="checkbox" class="switch"></label>
    <div id="repeatBox">
      <label class="row"><span>重复</span>
        <select id="fRepeat">
          <option value="none">不重复</option>
          <option value="day">每天</option>
          <option value="week">每周</option>
          <option value="2week">每两周</option>
          <option value="month">每月</option>
        </select>
      </label>
      <label class="row" id="rowUntil" hidden><span>直到</span><input id="fUntil" type="date"></label>
    </div>
    <textarea id="fNote" placeholder="备注" rows="3"></textarea>
    <button class="danger-btn" id="btnDelete">删除事件</button>
  </div>
</section>

<!-- 设置 -->
<section class="sheet tall" id="setSheet" aria-label="设置">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2>设置</h2>
    <button class="text-btn" data-close>完成</button>
  </div>
  <div class="form scroll">
    <h3>外观</h3>
    <div class="seg" id="sTheme">
      <button data-v="auto">跟随系统</button><button data-v="light">浅色</button><button data-v="dark">深色</button>
    </div>
    <h3>每周第一天</h3>
    <div class="seg" id="sWeek">
      <button data-v="0">周日</button><button data-v="1">周一</button>
    </div>

    <h3>多设备同步</h3>
    <p class="hint">在每台设备填同一个 GitHub 令牌，日历就会自动同步，桌面小组件也从这里读取。数据存在你账号下的一个私密 Gist，令牌只保存在本机。</p>
    <label class="field"><span>GitHub 令牌（需 gist 权限）</span><input id="sToken" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off"></label>
    <label class="field"><span>Gist ID（一般留空，会用令牌自动找到或创建）</span><input id="sGist" type="text" placeholder="自动" autocomplete="off"></label>
    <div class="btn-row">
      <button class="pill" id="btnSync">立即同步</button>
      <span class="hint" id="syncStatus">未开启同步</span>
    </div>

    <h3>桌面小组件</h3>
    <div class="btn-row wrap">
      <button class="pill" id="btnCopyIOS">复制 iOS 小组件脚本</button>
      <button class="pill" id="btnCopyAndroid">复制安卓小组件链接</button>
    </div>
    <p class="hint">iOS：在 Scriptable 新建脚本并粘贴，再到桌面添加 Scriptable 小组件选择它。安卓：用支持网页的小组件 App 打开该链接。详见 README。</p>

    <h3>数据</h3>
    <div class="btn-row wrap">
      <button class="pill" id="btnExport">导出备份</button>
      <button class="pill" id="btnImport">导入备份</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="hint" id="statLine"></p>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
