name: 节律提醒

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: mcal-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装推送库
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: 检查并发送提醒
        run: node scripts/send-reminders.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
