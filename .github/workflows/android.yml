name: 安卓 App

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查签名密钥
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ] || [ -z "$KA" ]; then
            echo "::error::还没有设置签名密钥，请在仓库 Settings → Secrets and variables → Actions 添加 ANDROID_KEYSTORE_B64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS 后重新运行。"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 编译并签名
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/month-calendar.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: 读取版本号
        id: v
        run: echo "name=$(sed -nE 's/.*"version"[^"]*"([^"]+)".*/\1/p' version.json | sed -E 's/-b[0-9]+$//')" >> "$GITHUB_OUTPUT"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.v.outputs.name }}-${{ github.run_number }}
          name: 节律安卓 App ${{ steps.v.outputs.name }}
          body: 在手机上打开这个页面，下载 month-calendar.apk 并安装，会直接覆盖旧版，数据和设置都保留。
          files: ${{ runner.temp }}/month-calendar.apk
          make_latest: true

      # 国内打不开 GitHub Releases：同一个安装包再放一份到 dist-android 分支（只保留最新一个），
      # App 检查更新时 GitHub 连不上就改问 jsDelivr 镜像上的 apk.json，并从镜像下载
      - name: 发布到国内镜像（dist-android 分支）
        env:
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ github.run_number }}
        run: |
          D="$RUNNER_TEMP/dist-android"
          mkdir -p "$D" && cd "$D"
          cp "$RUNNER_TEMP/month-calendar.apk" .
          printf '{ "code": %s, "name": "%s" }\n' "$CODE" "$NAME" > apk.json
          git init -q -b dist-android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "安卓安装包 $NAME（$CODE）"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist-android
          for f in apk.json month-calendar.apk; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist-android/$f" > /dev/null || echo "刷新镜像缓存失败：$f（稍后会自动更新）"
          done
