<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月历小组件</title>
<style>
  :root { --accent:#56789A; --p3:#E05A55; --p2:#E3A040; --p1:#4B82E8; --p0:#8D929B; }
  :root[data-theme="dark"] { --accent:#6A8AAB; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent:#6A8AAB; } }
  :root, :root[data-theme="light"] { color-scheme:light; --bg:#F1F2F5; --line:#DEE0E6; --text:#1C1C1E; --text2:#86868C; --text3:#C3C3C8; --mix:20%; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --bg:#1C1C1E; --line:#2A2A2D; --text:#F2F2F5; --text2:#8E8E93; --text3:#4A4A4F; --mix:30%; }
  }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#1C1C1E; --line:#2A2A2D; --text:#F2F2F5; --text2:#8E8E93; --text3:#4A4A4F; --mix:30%; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system, "Noto Sans SC", "PingFang SC", Roboto, sans-serif; }
  a.wrap { display:flex; flex-direction:column; height:100%; padding:4px 0 0; color:inherit; text-decoration:none; }
  .head { display:flex; align-items:baseline; justify-content:space-between; padding:0 10px 1px; }
  .head b { font-size:12.5px; color:var(--accent); }
  .head span { font-size:9.5px; color:var(--text2); }
  .wd { display:grid; grid-template-columns:repeat(7,1fr); font-size:8.5px; color:var(--text2); text-align:center; padding-bottom:1px; }
  .grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:.5px solid var(--line); overflow:hidden; }
  .c { border-right:.5px solid var(--line); border-bottom:.5px solid var(--line); overflow:hidden; padding:2px 1px 0; min-width:0; }
  .c:nth-child(7n) { border-right:0; }
  .c:nth-last-child(-n+7) { border-bottom:0; }
  .n { min-width:18px; height:18px; padding:0 3px; margin:2px 0 2px 3px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; }
  .out .n { color:var(--text3); } .out .chip { opacity:.55; }
  .today .n { background:var(--accent); color:#fff; font-weight:700; }
  .chip { height:14px; line-height:14px; font-size:9.5px; font-weight:600; margin:0 1px 1px; padding:0 1.5px; border-radius:3.5px; letter-spacing:-.02em;
    white-space:nowrap; overflow:hidden; background:var(--c); color:#fff; }
  .chip.done { background:color-mix(in srgb, var(--c) var(--mix), transparent); color:color-mix(in srgb, var(--c) 72%, var(--text2)); text-decoration:line-through; }
  .more { font-size:8px; color:var(--text2); padding-left:2px; }
  .msg { margin:auto; text-align:center; font-size:13px; color:var(--text2); padding:16px; line-height:1.6; }
  .sr { display:flex; align-items:center; gap:8px; padding:6px 8px; margin:0 6px 4px; border-radius:10px; }
  .sr.live { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .sr i { width:3.5px; height:28px; border-radius:2px; flex:none; }
  .sr div { flex:1; min-width:0; font-size:13px; }
  .sr b { font-weight:600; } .sr em { font-style:normal; font-size:11px; color:var(--text2); }
  .sr small { display:block; font-size:11px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sr span { font-size:10px; font-weight:600; color:var(--accent); }
</style>
</head>
<body>
<a class="wrap" id="root" href="./"><div class="msg">加载中…</div></a>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const GIST = q.get('gist') || '';
  const WS = Number(q.get('ws') || 0) === 1 ? 1 : 0;
  const theme = q.get('theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  const COLORS = { 3:'var(--p3)', 2:'var(--p2)', 1:'var(--p1)', 0:'var(--p0)' };
  const WD = ['日','一','二','三','四','五','六'];
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CACHE_KEY = 'mcal.widget.cache';
  const root = document.getElementById('root');

  async function load() {
    if (!GIST) {
      // 与 App 同源时可直接读取本机数据（便于在浏览器里预览）
      const local = localStorage.getItem('mcal.data.v1');
      if (local) return JSON.parse(local);
      throw new Error('链接里缺少 gist 参数。请在月历 App 的设置中「复制安卓小组件链接」。');
    }
    try {
      const headers = { Accept: 'application/vnd.github+json' };
      const etag = localStorage.getItem(CACHE_KEY + '.etag');
      const cached = localStorage.getItem(CACHE_KEY);
      if (etag && cached) headers['If-None-Match'] = etag; // 没变化时只返回 304，不占用频率额度
      const r = await fetch('https://api.github.com/gists/' + encodeURIComponent(GIST), { headers, cache: 'no-store' });
      if (r.status === 304 && cached) return JSON.parse(cached);
      if (!r.ok) throw new Error('GitHub 返回 ' + r.status);
      try { localStorage.setItem(CACHE_KEY + '.etag', r.headers.get('ETag') || ''); } catch (e) {}
      const g = await r.json();
      const f = g.files && g.files['mcal-calendar.json'];
      if (!f) throw new Error('Gist 中没有月历数据');
      const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      try { localStorage.setItem(CACHE_KEY, text); } catch (e) {}
      return JSON.parse(text);
    } catch (e) {
      const c = localStorage.getItem(CACHE_KEY);
      if (c) return JSON.parse(c);
      throw e;
    }
  }

  function render(data) {
    const now = new Date(), y = now.getFullYear(), m = now.getMonth(), t = ymd(now);
    const by = {}, shown = new Set((data.cals || []).filter(c => c && c.showInMain).map(c => c.id));
    for (const e of data.events || []) {
      if (e.cal && !shown.has(e.cal)) continue; // 主日历 + 设为在主日历显示的记录日历
      const n = e.days > 1 && !e.time ? e.days : 1, [yy, mm, dd] = e.date.split('-').map(Number);
      for (let k = 0; k < n; k++) { const ds = ymd(new Date(yy, mm - 1, dd + k)); (by[ds] = by[ds] || []).push(e); }
    }
    for (const k in by) by[k].sort((a,b) => (a.done-b.done) || (b.priority-a.priority) || (a.createdAt-b.createdAt));
    const prefix = `${y}-${pad(m+1)}-`;
    let total = 0, done = 0;
    for (const k in by) if (k.startsWith(prefix)) { total += by[k].length; done += by[k].filter(e => e.done).length; }

    const first = new Date(y, m, 1);
    const off = (first.getDay() - WS + 7) % 7;
    const rows = Math.ceil((off + new Date(y, m + 1, 0).getDate()) / 7); // 只显示本月所在的几周
    const gridH = window.innerHeight - 30;
    const rowH = gridH / rows;
    const max = Math.max(1, Math.floor((rowH - 24) / 15));
    let cells = '';
    for (let i = 0; i < rows * 7; i++) {
      const d = new Date(y, m, 1 - off + i), ds = ymd(d);
      const evs = by[ds] || [];
      const fit = evs.length <= max ? evs.length : max - 1;
      let chips = '';
      for (let k = 0; k < fit; k++) { const mm = String(evs[k].title).match(/^\s*([A-Za-z]{2,4})\s?(\d{4})\b/); const lb = mm ? `${mm[1].toUpperCase()} ${mm[2]}` : evs[k].title;
        chips += `<div class="chip${evs[k].done ? ' done' : ''}" style="--c:${COLORS[evs[k].priority] || COLORS[0]}">${esc(lb)}</div>`; }
      if (fit < evs.length) chips += `<div class="more">+${evs.length - fit}</div>`;
      cells += `<div class="c${d.getMonth() !== m ? ' out' : ''}${ds === t ? ' today' : ''}"><div class="n">${d.getDate()}</div>${chips}</div>`;
    }
    let wd = '';
    for (let i = 0; i < 7; i++) wd += `<div>${WD[(i + WS) % 7]}</div>`;
    root.innerHTML = `<div class="head"><b>${m+1}月</b><span>${total ? `完成 ${done}/${total}` : '本月暂无事件'}</span></div>
      <div class="wd">${wd}</div><div class="grid" style="grid-template-rows:repeat(${rows},minmax(0,1fr))">${cells}</div>`;
  }

  // 课表模式：今天还没上完的课（今天没课就显示下一个有课的日子）
  const PAL = ['#5D7895', '#5F9479', '#C38F45', '#BE6662', '#86769F', '#4E8C92', '#6170A3', '#9A7B5C'];
  const colorOf = c => { let h = 0; for (const x of c) h = (h * 31 + x.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  function renderSched(data) {
    const cs = data.courses || [], now = new Date(), nm = now.getHours() * 60 + now.getMinutes(), today = (now.getDay() + 6) % 7 + 1;
    const mondayOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
    const onDate = (c, date) => {
      if ((date.getDay() + 6) % 7 + 1 !== c.day) return false;
      const ds = ymd(date);
      if ((c.from && ds < c.from) || (c.to && ds > c.to)) return false;
      if (c.every === 2 && c.from) { const [y, m, d] = c.from.split('-').map(Number); if (Math.round((mondayOf(date) - mondayOf(new Date(y, m - 1, d))) / 6048e5) % 2) return false; }
      return true;
    };
    let pick = null;
    for (let k = 0; k < 15 && !pick; k++) {
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + k), d = (date.getDay() + 6) % 7 + 1;
      let list = cs.filter(c => onDate(c, date)).sort((a, b) => toMin(a.start) - toMin(b.start));
      if (k === 0) list = list.filter(c => toMin(c.end) > nm);
      if (list.length) pick = { d, k, list };
    }
    if (!cs.length || !pick) { root.innerHTML = `<div class="msg">${cs.length ? '这周没有课' : '还没有导入课表'}</div>`; return; }
    const label = pick.k === 0 ? '今天' : pick.k === 1 ? '明天' : `周${WD[pick.d % 7]}`;
    root.innerHTML = `<div class="head"><b>${label}</b><span>周${WD[pick.d % 7]}</span></div>` + pick.list.slice(0, 5).map(c => {
      const live = pick.k === 0 && nm >= toMin(c.start);
      return `<div class="sr${live ? ' live' : ''}"><i style="background:${colorOf(c.code)}"></i><div><b>${esc(c.code)}</b>${c.type ? ` <em>${esc(c.type)}</em>` : ''}<small>${c.start}–${c.end}${c.room ? ' · ' + esc(c.room) : ''}</small></div>${live ? '<span>上课中</span>' : ''}</div>`;
    }).join('');
    root.href = './#sched';
  }
  async function refresh() {
    try { const d = await load(); if (q.get('mode') === 'sched') renderSched(d); else render(d); }
    catch (e) { root.innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  }
  refresh();
  setInterval(refresh, 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(refresh, 200); });
})();
</script>
</body>
</html>
