<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节律小组件</title>
<style>
  :root { --accent:#4C6EAC; --p3:#D9453E; --p2:#D88018; --p1:#3C7DC2; --p0:#979CA2;
    --p3f:#AC312C; --p3i:#FFE2DE; --p2f:#BB6800; --p2i:#FCE5D3; --p1f:#255593; --p1i:#DDEBFD; --p0f:#383B3F; --p0i:#E8E9EB; }
  :root[data-theme="dark"] { --accent:#8BA8DE; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent:#8BA8DE; } }
  :root, :root[data-theme="light"] { color-scheme:light; --bg:#ECF2F5; --line:#DAE1E5; --text:#171B20; --text2:#747B83; --text3:#B9BFC3; --mix:20%;
    --chip-weight:600; }
  .chip { --chip-bg:var(--c); --chip-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --bg:#1B1C21; --line:#292A2F; --text:#EEEEF1; --text2:#8C8E97; --text3:#494A50; --mix:30%;
      --chip-weight:500; }
    :root:not([data-theme="light"]) .chip:not(.done) { --chip-bg:var(--cf); --chip-fg:var(--ci); }
  }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#1B1C21; --line:#292A2F; --text:#EEEEF1; --text2:#8C8E97; --text3:#494A50; --mix:30%;
    --chip-weight:500; }
  :root[data-theme="dark"] .chip:not(.done) { --chip-bg:var(--cf); --chip-fg:var(--ci); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system, "Noto Sans SC", "PingFang SC", Roboto, sans-serif; }
  a.wrap { display:flex; flex-direction:column; height:100%; padding:4px 0 0; color:inherit; text-decoration:none; }
  .head { display:flex; align-items:baseline; justify-content:space-between; padding:0 10px 1px; }
  .head b { font-size:12.5px; color:var(--accent); }
  .head span { font-size:9.5px; color:var(--text2); }
  .wd { display:grid; grid-template-columns:repeat(7,1fr); font-size:8.5px; color:var(--text2); text-align:center; padding-bottom:1px; }
  .grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:.5px solid var(--line); overflow:hidden; }
  .c { border-right:.5px solid var(--line); border-bottom:.5px solid var(--line); overflow:hidden; padding:2px 1px 0; min-width:0; }
  .c:nth-child(7n) { border-right:0; }
  .c.last { border-bottom:0; } /* 最后一行（格子后面还跟着横条，不能用 nth-last-child） */
  .n { min-width:18px; height:18px; padding:0 3px; margin:2px 0 2px 3px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; }
  .out .n { color:var(--text3); } .out .chip { opacity:.55; }
  .today .n { background:var(--accent); color:#fff; font-weight:700; }
  /* 事件色条，和应用一致：浅色实色底白字；深色用专门的深色调 + 带同色的柔白字、中等字重 */
  .chip { height:14px; line-height:14px; font-size:9.5px; font-weight:var(--chip-weight); margin:0 1px 1px; padding:0 1.5px; border-radius:3.5px; letter-spacing:-.02em;
    white-space:nowrap; overflow:hidden;
    background:var(--chip-bg); color:var(--chip-fg); }
  .chip.done { background:color-mix(in srgb, var(--c) var(--mix), transparent); color:color-mix(in srgb, var(--c) 72%, var(--text2)); text-decoration:line-through; }
  .more { font-size:8px; color:var(--text2); padding-left:2px; }
  .chip.gap { visibility:hidden; }
  /* 时间行（当天事件下面）；放不下时间行时，色条右端的小点表示「有具体时间」 */
  .ct { height:10px; line-height:10px; font-size:8px; font-weight:500; color:var(--text2); margin:0 1px 1px 2.5px; white-space:nowrap; overflow:hidden; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .ct.done { opacity:.5; }
  .out .ct { opacity:.55; }
  .chip.tm { position:relative; padding-right:6px; }
  .chip.tm::after { content:''; position:absolute; right:2.5px; top:50%; width:3px; height:3px; margin-top:-1.5px; border-radius:50%; background:currentColor; opacity:.75; }
  /* 今天：整格叠一层淡主色；还有放不下的事件时，「+n」用主色小标签 */
  /* 今天：一块带小圆角的淡主色，四周留一点边 */
  .c { position:relative; }
  .c.today::before { content:''; position:absolute; inset:1.5px 1.5px 2px; border-radius:4px; background:color-mix(in srgb, var(--accent) 12%, transparent); pointer-events:none; }
  :root[data-theme="dark"] .c.today::before { background:color-mix(in srgb, var(--accent) 20%, transparent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .c.today::before { background:color-mix(in srgb, var(--accent) 20%, transparent); } }
  .c > * { position:relative; }
  .nr { display:flex; align-items:center; justify-content:space-between; padding-right:2px; }
  .c.today .more { display:inline-block; color:#fff; background:var(--accent); border-radius:4px; padding:0 3px; font-weight:700; margin-left:2px; }
  /* 跨天的全天事件：作为网格里横跨几列的一项，叠在格子上面连成一条 */
  .bar { z-index:1; align-self:start; pointer-events:none; margin:calc(24px + var(--s) * 15px) 2px 0; }
  .bar.ol { margin-left:0; border-top-left-radius:0; border-bottom-left-radius:0; }
  .bar.or { margin-right:0; border-top-right-radius:0; border-bottom-right-radius:0; }
  .bar.out { opacity:.55; }
  .msg { margin:auto; text-align:center; font-size:13px; color:var(--text2); padding:16px; line-height:1.6; }
  .sr { display:flex; align-items:center; gap:8px; padding:6px 8px; margin:0 6px 4px; border-radius:10px; }
  .sr.live { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .sr i { width:3.5px; height:28px; border-radius:2px; flex:none; }
  .sr div { flex:1; min-width:0; font-size:13px; }
  .sr b { font-weight:600; } .sr em { font-style:normal; font-size:11px; color:var(--text2); }
  .sr small { display:block; font-size:11px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sr span { font-size:10px; font-weight:600; color:var(--accent); }
</style>
</head>

e la journée"}, "ja": {"研讨": "セミナー", "完成 {0}/{1}": "{0}/{1} 完了", "明天": "明日", "中号": "中", "课表": "時間割", "今天 · {0}": "今日 · {0}", "还有 {0} 节": "あと {0} コマ", "Gist 中没有节律数据": "この Gist には Cadence のデータがありません", "实验": "実験", "还没有导入课表": "まだ時間割を読み込んでいません", "离线 · 显示缓存": "オフライン · キャッシュを表示", "大号": "大", "第一节": "最初の授業", "这周没有课": "今週は授業がありません", "今天": "今日", "加载中…": "読み込み中…", "GitHub 返回 {0}": "GitHub の応答：{0}", "下一节": "次の授業", "今天没有事件": "今日は予定がありません", "预览哪种尺寸？": "どのサイズをプレビューしますか？", "离线": "オフライン", "{0}课表": "{0}の時間割", "取消": "キャンセル", "还没有设置 Gist ID。\n请在节律 App 设置里「复制 iOS 小组件脚本」后重新粘贴，或在小组件参数中填写。": "Gist ID が設定されていません。\nCadence の設定で「iOS ウィジェットのスクリプトをコピー」してから貼り付け直すか、ウィジェットのパラメータに入力してください。", "{0} 分钟后": "{0} 分後", "讨论课": "ディスカッション", "节律": "Cadence", "没有找到节律数据": "Cadence のデータが見つかりません", "小号": "小", "本月暂无事件": "今月は予定がありません", "今天还有 {0} 项": "今日はあと {0} 件", "接下来": "この後", "今天 {0}/{1} 完成": "今日 {0}/{1} 完了", "请在节律 设置 → 桌面小组件 里复制「iOS 课表小组件」脚本后重新粘贴。": "Cadence の 設定 → ウィジェット で「iOS 時間割ウィジェット」のスクリプトをコピーして貼り付け直してください。", "链接里缺少 gist 参数。请在节律 App 的设置中「复制安卓小组件链接」。": "リンクに gist パラメータがありません。Cadence の設定で「Android ウィジェットのリンクをコピー」してください。", "最近两周没有课": "この先 2 週間は授業がありません", "本周课表": "今週の時間割", "辅导": "演習", "讲座": "講義", "上课中": "授業中", "今天无事件": "今日は予定がありません", "{0} 小时后": "{0} 時間後", "全天": "終日"}};
  const tr = (s, ...a) => String((W_TR[LANG] && W_TR[LANG][s]) || s).replace(/\{(\d)\}/g, (m, n) => (a[n] !== undefined ? a[n] : m));
  const isZh = () => LANG === "zh-Hans" || LANG === "zh-Hant";
  const wdShort = i => (LANG === "en" ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][i] : LANG === "fr" ? ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."][i] : LANG === "ja" ? "日月火水木金土"[i] : "日一二三四五六"[i]);
  const wdHead = i => (LANG === "en" ? ["S", "M", "T", "W", "T", "F", "S"][i] : LANG === "fr" ? ["D", "L", "M", "M", "J", "V", "S"][i] : LANG === "ja" ? "日月火水木金土"[i] : "日一二三四五六"[i]);
  const wkName = i => (isZh() ? "周" + "日一二三四五六"[i] : wdShort(i));
  const monName = m => (LANG === "en" ? ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][m] : LANG === "fr" ? ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."][m] : `${m + 1}月`);
  const mdName = (m, d) => (LANG === "en" ? `${monName(m)} ${d}` : LANG === "fr" ? `${d} ${monName(m)}` : `${m + 1}月${d}日`);

  const pad = n => String(n).padStart(2,'0');

  const CACHE_KEY = 'mcal.widget.cache';
  const root = document.getElementById('root');

  async function load() {
    if (!GIST) {
      // 与 App 同源时可直接读取本机数据（便于在浏览器里预览）
      const local = localStorage.getItem('mcal.data.v1');

    }
    try {
      const headers = { Accept: 'application/vnd.github+json' };
      const etag = localStorage.getItem(CACHE_KEY + '.etag');
      const cached = localStorage.getItem(CACHE_KEY);
      if (etag && cached) headers['If-None-Match'] = etag; // 没变化时只返回 304，不占用频率额度

      if (c) return JSON.parse(c);

  }

  function render(data) {
    const now = new Date(), y = now.getFullYear(), m = now.getMonth(), t = ymd(now);
    const by = {}, shown = new Set((data.cals || []).filter(c => c && c.showInMain).map(c => c.id));
    for (const e of data.events || []) {
      if (e.cal && !shown.has(e.cal)) continue; // 主日历 + 设为在主日历显示的记录日历
      const n = e.days > 1 && !e.time ? e.days : 1, [yy, mm, dd] = e.date.split('-').map(Number);
      for (let k = 0; k < n; k++) { const ds = ymd(new Date(yy, mm - 1, dd + k)); (by[ds] = by[ds] || []).push(e); }
    }
    for (const k in by) by[k].sort((a,b) => (a.done-b.done) || (RANK(b.priority)-RANK(a.priority)) || (a.createdAt-b.createdAt));
    const prefix = `${y}-${pad(m+1)}-`;
    let total = 0, done = 0;
    for (const k in by) if (k.startsWith(prefix)) { total += by[k].length; done += by[k].filter(e => e.done).length; }

    const first = new Date(y, m, 1);
    const off = (first.getDay() - WS + 7) % 7;
    const rows = Math.ceil((off + new Date(y, m + 1, 0).getDate()) / 7); // 只显示本月所在的几周
    const gridH = window.innerHeight - 30;
    const rowH = gridH / rows;
    const max = Math.max(1, Math.floor((rowH - 24) / 15));
    CLOCK = (data.profile && data.profile.clock) || 'auto';
    const cellW = window.innerWidth / 7 - 6.5; // 格子宽 - 内边距 - 时间行左右边距
    const mctx = document.createElement('canvas').getContext('2d');
    mctx.font = `500 8px ${getComputedStyle(document.body).fontFamily}`;
    const textW = t => mctx.measureText(t).width + 1;
    const label = e => { const mm = String(e.title).match(/^\s*([A-Za-z]{2,4})\s?(\d{4})\b/); return mm ? `${mm[1].toUpperCase()} ${mm[2]}` : e.title; };
    // 记录日历里没设优先级的事件用日历自己的颜色（和应用一致），深色用同一套算法生成的深色调
    const calc = new Map((data.cals || []).filter(c => c && c.color).map(c => [c.id, c.color]));
    const chip = (e, cls = '', st = '') => { const p = COLORS[e.priority] ? e.priority : 0, ch = e.cal && !e.priority && calc.get(e.cal);
      const vars = ch ? (() => { const [f, i] = darkTone(ch); return `--c:${ch};--cf:${f};--ci:${i}`; })() : `--c:var(--p${p});--cf:var(--p${p}f);--ci:var(--p${p}i)`;
      return `<div class="chip${cls}${e.done ? ' done' : ''}" style="${vars}${st}">${esc(label(e))}</div>`; };
    const endOf = e => { const [a, b, c] = e.date.split('-').map(Number); return ymd(new Date(a, b - 1, c + e.days - 1)); };
    let cells = '', bars = '';
    for (let r = 0; r < rows; r++) {
      // 一周的排位：跨天事件先占上面几行（开始早、跨得长的在上），单天事件填进空位
      const days = [], evsBy = [];
      for (let c = 0; c < 7; c++) { const d = new Date(y, m, 1 - off + r * 7 + c); days.push(d); evsBy.push(by[ymd(d)] || []); }
      const multi = new Map();
      evsBy.forEach((evs, c) => evs.forEach(e => { if (!(e.days > 1 && !e.time)) return; const b = multi.get(e); if (b) b.c1 = c; else multi.set(e, { e, c0: c, c1: c }); }));
      const occ = days.map(() => []);
      const list = [...multi.values()].sort((a, b) => (a.c0 - b.c0) || ((b.c1 - b.c0) - (a.c1 - a.c0)));
      for (const b of list) {
        let s = 0; while (occ.slice(b.c0, b.c1 + 1).some(o => o[s])) s++;
        b.s = s; for (let c = b.c0; c <= b.c1; c++) occ[c][s] = b;
      }
      evsBy.forEach((evs, c) => evs.forEach(e => { if (multi.has(e)) return; let s = 0; while (occ[c][s]) s++; occ[c][s] = { e }; }));
      const lim = occ.map(o => Math.min(o.length, max)); // 「+n」放在日期右边，事件行全部留给事件
      for (let c = 0; c < 7; c++) {
        const d = days[c], ds = ymd(d), o = occ[c];
        let chips = '';
        const hidden = o.slice(lim[c]).filter(Boolean).length;
        // 有时间的事件：高度够就在色条下面加一行时间（和应用一致），不够就在色条右端点一个小点。
        // 时间行会把下面的东西往下推，所以只给最后一条跨天横条下面的事件加
        const shownN = Math.min(lim[c], o.length);
        let lastBar = -1; for (let s = 0; s < shownN; s++) if (o[s] && 's' in o[s]) lastBar = s;
        let nt = 0; for (let s = lastBar + 1; s < shownN; s++) if (o[s] && o[s].e.time) nt++;
        const withTime = nt && !hidden && 15 * shownN + 11 * nt <= rowH - 24;
        for (let s = 0; s < shownN; s++) {
          if (!o[s] || 's' in o[s]) { chips += '<div class="chip gap"></div>'; continue; }
          const e = o[s].e, tl = e.time && withTime && s > lastBar;
          chips += chip(e, e.time && !tl ? ' tm' : '');
          if (tl) { const r = e.endTime ? fmtR(e.time, e.endTime) : fmtT(e.time); chips += `<div class="ct${e.done ? ' done' : ''}">${esc(textW(r) <= cellW ? r : fmtT(e.time))}</div>`; }
        }

        // 格子显式摆放：否则自动排列会绕开横条占的位置，整个网格错位
        cells += `<div class="c${d.getMonth() !== m ? ' out' : ''}${ds === t ? ' today' : ''}${r === rows - 1 ? ' last' : ''}" style="grid-row:${r + 1};grid-column:${c + 1}"><div class="nr"><div class="n">${d.getDate()}</div>${hidden ? `<span class="more">+${hidden}</span>` : ''}</div>${chips}</div>`;
      }
      // 横条：在「+n」挡住的日子断开，其余连成一整条；延续到上一周 / 下一周的一端是平的
      for (const b of list) {
        for (let c = b.c0; c <= b.c1;) {
          if (b.s >= lim[c]) { c++; continue; }
          let d = c; while (d + 1 <= b.c1 && b.s < lim[d + 1]) d++;
          const out = days.slice(c, d + 1).every(x => x.getMonth() !== m);
          bars += chip(b.e, ` bar${ymd(days[c]) !== b.e.date ? ' ol' : ''}${ymd(days[d]) !== endOf(b.e) ? ' or' : ''}${out ? ' out' : ''}`,
            `;--s:${b.s};grid-row:${r + 1};grid-column:${c + 1} / span ${d - c + 1}`);
          c = d + 1;
        }
      }
    }
    cells += bars;
    let wd = '';
    for (let i = 0; i < 7; i++) wd += `<div>${wdShort((i + WS) % 7)}</div>`;
    root.innerHTML = `<div class="head"><b>${monName(m)}</b><span>${total ? tr('完成 {0}/{1}', done, total) : tr('本月暂无事件')}</span></div>
      <div class="wd">${wd}</div><div class="grid" style="grid-template-rows:repeat(${rows},minmax(0,1fr))">${cells}</div>`;
  }

  // 课表模式：今天还没上完的课（今天没课就显示下一个有课的日子）
  // ---------- 课程配色（应用 / 小组件共用同一套算法） ----------
  // 科目定「锚点色相」（数学 = 晴空蓝、经济 = 玉青、语言 = 杏……），再把这学期的所有课程在色环上推开：
  // 有含义（同科目颜色相近），又整体均匀（任意两门至少隔开一段距离）；跳过黄绿一带（深色下会发橄榄色）。
  // 每门课明度、彩度相同，只有色相不同，所以一样醒目。
  const CRS_FAM = [
    [240, ['MAT', 'STA']], [205, ['CSI', 'ITI', 'SEG', 'CEG', 'ELG', 'GNG', 'MCG', 'CVG', 'CHG']], [275, ['PHY', 'CHM', 'EVS', 'GEO', 'ERS']],
    [140, ['BIO', 'BCH', 'BPS', 'ANP', 'HSS', 'NUT']], [175, ['ECO', 'ADM', 'FIN']], [58, ['ENG', 'FRA', 'ESL', 'FLS', 'LIN', 'ESP', 'ALL']],
    [18, ['HIS', 'PHI', 'CLA', 'REL']], [310, ['PSY', 'SOC', 'POL', 'CRM', 'ANT']], [345, ['ART', 'MUS', 'THE', 'ARV']],
  ];
  function courseHues(list) {
    const G0 = 78, G1 = 138, U = 360 - (G1 - G0);
    const toU = h => (h < G0 ? h : h < G1 ? G0 : h - (G1 - G0)), toH = u => (u < G0 ? u : u + (G1 - G0));
    const wrap = x => ((x % U) + U) % U, sd = (a, b) => { const d = wrap(b - a); return d > U / 2 ? d - U : d; };
    const codes = [...new Set(list)].sort(), pre = c => (String(c).match(/^[A-Za-z]+/) || [''])[0].toUpperCase();
    const anchor = new Map(); for (const [h, ps] of CRS_FAM) for (const p of ps) anchor.set(p, h);
    const used = new Set(codes.map(pre).filter(p => anchor.has(p)).map(p => anchor.get(p)));
    const free = CRS_FAM.map(f => f[0]).filter(h => !used.has(h));
    [...new Set(codes.map(pre).filter(p => !anchor.has(p)))].sort().forEach((p, i) => anchor.set(p, free.length ? free[i % free.length] : CRS_FAM[i % CRS_FAM.length][0]));
    const it = codes.map(c => ({ c, a: toU(anchor.get(pre(c))) })).sort((x, y) => x.a - y.a || (x.c < y.c ? -1 : x.c > y.c ? 1 : 0));
    const n = it.length; if (!n) return new Map();
    const D = Math.min(60, (U / n) * 0.8);
    const groups = new Map(); it.forEach(o => { if (!groups.has(o.a)) groups.set(o.a, []); groups.get(o.a).push(o); });
    for (const g of groups.values()) g.forEach((o, k) => (o.p = o.a + (k - (g.length - 1) / 2) * D));
    const push = () => { for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const A = it[i], B = it[j], d = sd(A.p, B.p), ad = Math.abs(d);
      if (ad < D) { const m = (D - ad) / 2 * (d >= 0 ? 1 : -1) + (ad === 0 ? 0.01 : 0); A.p -= m; B.p += m; } } };
    for (let r = 0; r < 300; r++) { for (const o of it) o.p += 0.06 * sd(o.p, o.a); push(); push(); push(); }
    for (let r = 0; r < 60; r++) push();
    return new Map(it.map(o => [o.c, Math.round(toH(wrap(o.p)) * 10) / 10]));
  }
  function oklchHex(L, C, H) { // 超出屏幕色域时降低彩度
    const g = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
    for (let c = C; c >= 0; c -= 0.005) {
      const A = c * Math.cos(H * Math.PI / 180), B = c * Math.sin(H * Math.PI / 180);
      const l = Math.pow(L + 0.3963377774 * A + 0.2158037573 * B, 3), m = Math.pow(L - 0.1055613458 * A - 0.0638541728 * B, 3), s = Math.pow(L - 0.0894841775 * A - 1.291485548 * B, 3);
      const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
      if (rgb.every(v => v >= -1e-4 && v <= 1.0001)) return '#' + rgb.map(v => Math.round(Math.min(1, Math.max(0, g(v))) * 255).toString(16).padStart(2, '0').toUpperCase()).join('');
    }
    return '#808080';
  }
  // 一门课的一整套颜色：浅色（淡底、深字、色条 / 小色块）、深色（深底、浅字、亮色条、深色小色块）
  const courseTone = h => ({ base: oklchHex(.64, .095, h), fillL: oklchHex(.955, .03, h), inkL: oklchHex(.42, .085, h), fillD: oklchHex(.30, .045, h),
    inkD: oklchHex(.86, .065, h), chipD: oklchHex(.42, .075, h), chipInkD: oklchHex(.935, .03, h), barD: oklchHex(.70, .095, h) });
  // ---------- 12 / 24 小时制：用应用里的设置（同步数据 profile.clock），「跟随地区」时按设备地区 ----------
  let CLOCK = 'auto';
  const region12 = () => {
    try {
      const loc = (typeof Device !== 'undefined' && Device.locale ? Device.locale() : (typeof navigator !== 'undefined' ? navigator.language : '')) || '';
      const parts = loc.replace('_', '-').split('-'), region = parts.length > 1 ? parts[parts.length - 1] : '';
      const tag = region ? new Intl.Locale('und-' + region).maximize().toString() : loc;
      const o = new Intl.DateTimeFormat(tag || undefined, { hour: 'numeric' }).resolvedOptions();
      return o.hourCycle ? /h1[12]/.test(o.hourCycle) : !!o.hour12;
    } catch (e) { return false; }
  };
  const use12 = () => (CLOCK === '12' ? true : CLOCK === '24' ? false : region12());
  const fmtT = (t, noHalf) => { if (!t || !use12()) return t || ''; const [h, m] = t.split(':').map(Number), hm = (h % 12 || 12) + ':' + String(m).padStart(2, '0'); return noHalf ? hm : isZh() ? (h < 12 ? '上午' : '下午') + hm : `${hm} ${h < 12 ? 'AM' : 'PM'}`; };
  const fmtR = (a, b) => { if (!use12()) return `${a}–${b}`; const same = (+a.slice(0, 2) < 12) === (+b.slice(0, 2) < 12); return isZh() ? `${fmtT(a)}–${fmtT(b, same)}` : `${fmtT(a, same)}–${fmtT(b)}`; };
  const hourLabel = h => (use12() ? (isZh() ? `${h < 12 ? '上午' : '下午'}${h % 12 || 12}` : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`) : `${h}:00`);
  const lin = v => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4), gam = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
  function toOklch(hex) {
    const n = parseInt(hex.slice(1), 16), r = lin((n >> 16) / 255), g = lin(((n >> 8) & 255) / 255), b = lin((n & 255) / 255);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
    return [L, Math.hypot(A, B), (Math.atan2(B, A) * 180 / Math.PI + 360) % 360];
  }
  function fromOklch(L, C, H) { // 超出屏幕色域时降低彩度
    for (let c = C; c >= 0; c -= 0.005) {
      const A = c * Math.cos(H * Math.PI / 180), B = c * Math.sin(H * Math.PI / 180);
      const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3, s = (L - 0.0894841775 * A - 1.291485548 * B) ** 3;
      const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
      if (rgb.every(v => v >= -1e-4 && v <= 1.0001)) return '#' + rgb.map(v => Math.round(Math.min(1, Math.max(0, gam(v))) * 255).toString(16).padStart(2, '0')).join('');
    }
    return '#808080';
  }
  const toneCache = new Map();
  const darkTone = hex => {
    if (toneCache.has(hex)) return toneCache.get(hex);
    const [, c, h] = toOklch(hex), warm = c < 0.03 ? 0 : Math.max(0, Math.min(1, (1 - Math.abs(h - 75) / 50) * 1.6));
    const t = c < 0.03 ? [fromOklch(0.36, c * 0.5, h), fromOklch(0.935, c * 0.3, h)]
      : [fromOklch(0.45 + 0.15 * warm, Math.min(c, 0.15), h), fromOklch(0.935, Math.min(0.035, c * 0.25), h)];
    toneCache.set(hex, t);
    return t;
  };
  // 新建记录日历的默认颜色：在可选颜色里挑和主日历（四个优先级色、主色）以及已有记录日历最不像的一个（OKLab 距离最大）
  let HUES = new Map();
  const colorOf = c => courseTone(HUES.has(c) ? HUES.get(c) : 240).base;
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  function renderSched(data) {
    const cs = data.courses || [];
    HUES = courseHues(cs.map(c => c.code));
    CLOCK = (data.profile && data.profile.clock) || 'auto';
    const now = new Date(), nm = now.getHours() * 60 + now.getMinutes(), today = (now.getDay() + 6) % 7 + 1;
    const mondayOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
    const onDate = (c, date) => {
      if ((date.getDay() + 6) % 7 + 1 !== c.day) return false;
      const ds = ymd(date);
      if ((c.from && ds < c.from) || (c.to && ds > c.to)) return false;
      if (c.every === 2 && c.from) { const [y, m, d] = c.from.split('-').map(Number); if (Math.round((mondayOf(date) - mondayOf(new Date(y, m - 1, d))) / 6048e5) % 2) return false; }
      return true;
    };
    let pick = null;
    for (let k = 0; k < 15 && !pick; k++) {
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + k), d = (date.getDay() + 6) % 7 + 1;
      let list = cs.filter(c => onDate(c, date)).sort((a, b) => toMin(a.start) - toMin(b.start));
      if (k === 0) list = list.filter(c => toMin(c.end) > nm);
      if (list.length) pick = { d, k, list };
    }
    if (!cs.length || !pick) { root.innerHTML = `<div class="msg">${cs.length ? tr('这周没有课') : tr('还没有导入课表')}</div>`; return; }
    const label = pick.k === 0 ? tr('今天') : pick.k === 1 ? tr('明天') : wkName(pick.d % 7);
    root.innerHTML = `<div class="head"><b>${label}</b><span>${wkName(pick.d % 7)}</span></div>` + pick.list.slice(0, 5).map(c => {
      const live = pick.k === 0 && nm >= toMin(c.start);
      return `<div class="sr${live ? ' live' : ''}"><i style="background:${colorOf(c.code)}"></i><div><b>${esc(c.code)}</b>${c.type ? ` <em>${esc(tr(c.type))}</em>` : ''}<small>${fmtR(c.start, c.end)}${c.room ? ' · ' + esc(c.room) : ''}</small></div>${live ? '<span>上课中</span>' : ''}</div>`;
    }).join('');
    root.href = './#sched';
  }
  async function refresh() {
    setLang(); { const m = document.querySelector('#root .msg'); if (m) m.textContent = tr('加载中…'); } // 拿到数据前：按设备语言
    try { const d = await load(); setLang(d.profile && d.profile.lang); if (q.get('mode') === 'sched') renderSched(d); else render(d); }
    catch (e) { root.innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  }
  refresh();
  setInterval(refresh, 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(refresh, 200); });
})();
</script>
