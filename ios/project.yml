# 节律 iPhone 版的 Xcode 工程描述。不用手改 Xcode 工程：运行 ./build.sh 会用 XcodeGen 从这里生成。
# 和 Mac 版共用：提醒和同步的核心（Engine）、iCloud 云盘同步（CloudSync）、液态玻璃导航层（GlassNav、GlassLens.metal）、
# 数据模型和多语言（macos/Shared）。iPhone 自己的只有网页外壳和桥接（App 文件夹）。
name: CadenceiOS
options:
  bundleIdPrefix: io.github.salmangox
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Team.xcconfig
  Release: Team.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"      # 以 version.json 为准，build.sh 编译时会覆盖
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"     # 只做 iPhone
    DEAD_CODE_STRIPPING: YES
targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - App
      - ../macos/Shared
      - ../macos/App/Engine.swift
      - ../macos/App/CloudSync.swift
      - ../macos/App/GlassNav.swift
      - ../macos/App/GlassLens.metal
    settings:
      base:
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: io.github.salmangox.cadence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cadence   # 桌面上显示的名字
        CFBundleName: Cadence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        CadenceAppURL: https://salmangox.github.io/month-calendar/
        CadenceRepo: SalmangoX/month-calendar
        NSCameraUsageDescription: 纪念日历的透明相机用相机拍摄带倒数的照片。
        NSPhotoLibraryAddUsageDescription: 把纪念日的分享图片保存到相册。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # 只为调试版在模拟器里打开本机网页
        CFBundleURLTypes:
          - CFBundleURLName: io.github.salmangox.cadence
            CFBundleURLSchemes: [cadence]
